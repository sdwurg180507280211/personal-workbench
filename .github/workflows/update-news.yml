name: Update daily news

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: update-daily-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public RSS news
        run: python3 scripts/fetch_news.py
      - name: Commit refreshed news when changed
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "chore: refresh daily news"
          git push
