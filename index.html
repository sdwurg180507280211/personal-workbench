<style>
:root{--p:#4a5df3;--bg:#f5f7fb;--ink:#182033;--muted:#6c7890;--line:#e7ebf3;--red:#e55469;--green:#24a87a;--orange:#ed8b2d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{height:100vh;position:sticky;top:0;background:#fff;border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:4px 7px 22px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#4a5df3,#765df5);font-weight:800}.muted,.brand small{color:var(--muted)}nav{display:grid;gap:5px}nav button{border:0;background:transparent;color:#526079;text-align:left;padding:10px 12px;border-radius:10px;display:flex;gap:10px}nav button.active{background:#eef0ff;color:var(--p);font-weight:700}.count{margin-left:auto;background:#eef1f6;padding:1px 7px;border-radius:99px;font-size:11px}.profile{margin-top:auto;border-top:1px solid var(--line);padding:15px 7px 0}.top{position:sticky;top:0;z-index:10;background:#fffffff2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:11px 24px;display:flex;gap:12px;align-items:center}.crumb{font-weight:700}.search{position:relative;width:min(430px,42vw)}.search input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#f8f9fc;outline:none}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.primary{background:var(--p);border-color:var(--p);color:#fff;font-weight:700}.content{max-width:1440px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.head h1{font-size:27px;margin:0 0 4px}.head p{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:16px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 10px 30px #2030500b}.stat strong{display:block;font-size:25px}.home{grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);align-items:start}.stack{display:grid;gap:16px}.sec{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.sec h2{margin:0;font-size:16px}.link{border:0;background:none;color:var(--p)}.task{display:grid;grid-template-columns:25px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid #f0f2f7}.task:first-child{border-top:0}.check{width:20px;height:20px;border:1.5px solid #c8cfda;border-radius:6px;background:#fff}.check.done{background:var(--green);border-color:var(--green);color:#fff}.done-title{text-decoration:line-through;color:#9aa3b4}.meta{font-size:11px;color:var(--muted)}.tag{display:inline-block;padding:2px 7px;border-radius:99px;background:#f1f3f7;color:#647088;font-size:10px}.red{background:#fff0f2;color:#cc465b}.green{background:#eaf8f2;color:#208663}.orange{background:#fff4e8;color:#bd691b}.blue{background:#eef0ff;color:var(--p)}.bar{height:7px;border-radius:99px;background:#edf0f5;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4a5df3,#7b67f5)}.prog{margin:13px 0}.row{display:flex;justify-content:space-between;gap:8px}.small{font-size:11px;color:var(--muted)}.late{color:var(--red)}.ahead{color:var(--green)}.quads{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.quad{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe;min-height:110px}.q1{border-top:3px solid var(--red)}.q2{border-top:3px solid var(--green)}.q3{border-top:3px solid var(--orange)}.q4{border-top:3px solid #aab2c5}.quad h3{font-size:12px;margin:0 0 8px}.mini{font-size:12px;padding:4px 0}.brief{border:1px solid #edf0f5;border-radius:11px;padding:11px;margin-top:9px}.brief b{display:block;margin:5px 0}.seg{display:flex;gap:3px;flex-wrap:wrap;background:#edf0f5;padding:4px;border-radius:10px;width:max-content;max-width:100%;margin-bottom:15px}.seg button{border:0;background:transparent;padding:6px 9px;border-radius:7px;color:#66728a}.seg button.active{background:#fff;color:var(--ink);font-weight:700}.newsgrid{grid-template-columns:repeat(2,1fr)}.news h3{font-size:16px;margin:9px 0 6px}.news p{color:#56627a}.why,.insight{background:#f8f8ff;border-left:3px solid #cfd4ff;padding:9px 11px;border-radius:0 9px 9px 0;color:#5f6980}.tasklayout,.catlayout{grid-template-columns:minmax(0,1fr) 300px;align-items:start}.goals{grid-template-columns:repeat(3,1fr)}.goal h3{margin:8px 0 2px}.days{font-size:30px;font-weight:800;margin:14px 0}.range{display:flex;gap:8px;align-items:center;margin-top:10px}.range input{flex:1;accent-color:var(--p)}.empty{text-align:center;color:var(--muted);padding:30px}.modalbg{display:none;position:fixed;inset:0;background:#151c2e66;z-index:50;align-items:center;justify-content:center;padding:18px}.modalbg.open{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:17px;padding:20px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:9px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.popover{display:none;position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:11px;padding:5px;box-shadow:0 12px 35px #20305018}.popover.open{display:block}.result{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px;border-radius:8px}.toast{position:fixed;right:20px;bottom:20px;background:#182033;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:1050px){.stats,.goals{grid-template-columns:repeat(2,1fr)}.home,.tasklayout,.catlayout{grid-template-columns:1fr}}@media(max-width:720px){.app{display:block}.side{position:fixed;left:-245px;z-index:40;transition:.2s}.side.open{left:0}.top{padding:10px 12px}.crumb{display:none}.search{flex:1;width:auto}.content{padding:18px 12px}.stats,.goals,.newsgrid,.quads{grid-template-columns:1fr}.head{flex-direction:column}.form{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head><body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">P</div><div><b>个人工作台</b><br><small>PERSONAL WORKBENCH</small></div></div><nav id="nav"></nav><div class="profile"><b>我的工作台</b><br><small class="muted">个人模式 · 本地保存</small></div></aside><section><header class="top"><button class="btn" id="menu">☰</button><div class="crumb" id="crumb">今日</div><div class="search"><input id="search" placeholder="搜索任务、目标或情报"><div class="popover" id="pop"></div></div><div class="spacer"></div><button class="btn" id="reset">↻</button><button class="btn primary" id="quick">＋ 新建任务</button></header><main class="content" id="content"></main></section></div>
<div class="modalbg" id="taskModal"><div class="modal"><div class="row"><h2>新建任务</h2><button class="btn close">×</button></div><form id="taskForm"><div class="form"><div class="field full"><label>任务名称</label><input name="title" required></div><div class="field"><label>分类</label><select name="category"><option>工作</option><option>生活</option><option>成长</option><option>考公</option><option>学习</option></select></div><div class="field"><label>截止日期</label><input type="date" name="due" required></div><div class="field"><label>重要</label><select name="important"><option value="1">是</option><option value="0">否</option></select></div><div class="field"><label>紧急</label><select name="urgent"><option value="1">是</option><option value="0">否</option></select></div><div class="field full"><label>关联目标</label><select name="goal" id="goalSelect"></select></div></div><div class="actions"><button type="button" class="btn close">取消</button><button class="btn primary">保存</button></div></form></div></div>
<div class="modalbg" id="goalModal"><div class="modal"><div class="row"><h2>新建目标</h2><button class="btn close">×</button></div><form id="goalForm"><div class="form"><div class="field full"><label>目标名称</label><input name="title" required></div><div class="field"><label>分类</label><select name="category"><option>成长</option><option>工作</option><option>生活</option><option>考公</option></select></div><div class="field"><label>进度 %</label><input name="progress" type="number" min="0" max="100" value="0"></div><div class="field"><label>开始日期</label><input type="date" name="start" required></div><div class="field"><label>截止日期</label><input type="date" name="end" required></div><div class="field full"><label>下一步</label><input name="next"></div></div><div class="actions"><button type="button" class="btn close">取消</button><button class="btn primary">保存</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
var K='personal-workbench:v1',D=new Date();D.setHours(0,0,0,0);function iso(d){return d.toISOString().slice(0,10)}function pd(n){var d=new Date(D);d.setDate(d.getDate()+n);return iso(d)}function esc(x){return String(x||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function seed(){var raw=[['完成本周工作总结并发送','工作',0,1,1,''],['行测资料分析专项练习 60 分钟','考公',0,1,0,'g1'],['整理本周财经与银行业政策笔记','成长',1,1,0,'g2'],['缴纳本月固定账单','生活',0,0,1,''],['更新简历中的项目经历','成长',3,1,0,'g3'],['晚间散步 30 分钟','生活',0,0,0,'']];var news=[['财经','今日宏观经济重点信息将在接入新闻源后自动汇总','财经、证券、股票、银行、保险、投行、国际和时政等信息统一形成事实摘要。','首版先验证信息结构，后续接入真实新闻源。'],['证券','证券市场晨间要点示例','同一事件的多来源报道会尽量归并，减少重复阅读。','重点回答今天值得关注什么，而不是制造无限新闻流。'],['银行','银行与保险行业动态示例','行业新闻单独打标签，形成长期行业观察。','适合金融专业背景下的行业追踪和求职准备。'],['时政','考公时政每日积累示例','后续优先引用权威公开来源，展示事实、时间与来源。','持续积累时政，不替用户作政治选择。'],['国际','国际财经事件追踪示例','重要国际事件将与资产、行业和宏观主题建立关联。','帮助建立事件—市场—行业观察框架。'],['投行','投行与资本市场动态示例','IPO、并购、再融资和券商业务内容将独立归类。','适合投行、券商方向求职准备。']];return{page:'today',view:'today',cat:'全部',tasks:raw.map(function(x,i){return{id:'t'+i,title:x[0],category:x[1],due:pd(x[2]),important:!!x[3],urgent:!!x[4],goal:x[5],done:false}}),goals:[{id:'g1',title:'公务员考试准备',category:'考公',progress:48,start:pd(-38),end:pd(46),next:'完成资料分析专项并复盘错题'},{id:'g2',title:'金融行业知识体系',category:'成长',progress:36,start:pd(-30),end:pd(90),next:'整理银行、保险、券商三条行业主线'},{id:'g3',title:'职业能力与求职材料',category:'成长',progress:67,start:pd(-25),end:pd(28),next:'完善简历并建立岗位跟踪表'}],news:news.map(function(n,i){return{id:'n'+i,category:n[0],title:n[1],summary:n[2],why:n[3],source:'演示数据',time:['08:20','09:10','10:05','11:30','12:15','13:40'][i]}})}}
var s;try{s=JSON.parse(localStorage.getItem(K))||seed()}catch(e){s=seed()}function save(){localStorage.setItem(K,JSON.stringify(s))}function left(d){return Math.ceil((new Date(d+'T00:00:00')-D)/86400000)}function dl(d){var n=left(d);return n===0?'今天':n===1?'明天':n<0?'逾期 '+(-n)+' 天':n+' 天后'}function q(t){return t.important&&t.urgent?'q1':t.important?'q2':t.urgent?'q3':'q4'}function qn(t){return{q1:'重要且紧急',q2:'重要不紧急',q3:'不重要但紧急',q4:'不重要不紧急'}[q(t)]}function active(){return s.tasks.filter(function(t){return!t.done})}function sort(a){return a.slice().sort(function(x,y){var m={q1:0,q2:1,q3:2,q4:3};return m[q(x)]-m[q(y)]||x.due.localeCompare(y.due)})}function tp(g){return Math.max(0,Math.min(100,Math.round((D-new Date(g.start+'T00:00:00'))/Math.max(1,new Date(g.end)-new Date(g.start))*100)))}
var navs=[['today','⌂','今日'],['intelligence','◫','情报'],['tasks','✓','任务'],['goals','◎','目标'],['work','▣','工作'],['life','♡','生活'],['growth','↗','成长']];function toast(x){var e=document.getElementById('toast');e.textContent=x;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove('show')},1500)}function head(t,p,a){return'<div class="head"><div><h1>'+t+'</h1><p>'+p+'</p></div><div>'+(a||'')+'</div></div>'}function tag(t){var c={q1:'red',q2:'green',q3:'orange',q4:''}[q(t)];return'<span class="tag '+c+'">'+qn(t)+'</span> <span class="tag blue">'+t.category+'</span>'}function task(t,del){return'<div class="task"><button class="check '+(t.done?'done':'')+'" data-toggle="'+t.id+'">'+(t.done?'✓':'')+'</button><div><b class="'+(t.done?'done-title':'')+'">'+esc(t.title)+'</b><div class="meta">'+tag(t)+'</div></div><span class="meta '+(left(t.due)<0&&!t.done?'late':'')+'">'+dl(t.due)+'</span>'+(del?'<button class="btn" data-del="'+t.id+'">删除</button>':'')+'</div>'}function prog(g){var tm=tp(g),d=g.progress-tm,pace=d>=5?'<span class="ahead">领先 '+d+'%</span>':d<=-5?'<span class="late">落后 '+(-d)+'%</span>':'<span>进度正常</span>';return'<div class="prog"><div class="row"><b>'+esc(g.title)+'</b><span>'+g.progress+'%</span></div><div class="bar"><i style="width:'+g.progress+'%"></i></div><div class="row small"><span>时间 '+tm+'% · 剩余 '+Math.max(0,left(g.end))+' 天</span>'+pace+'</div><div class="meta">下一步：'+esc(g.next||'尚未设置')+'</div></div>'}function quads(){var a=[['q1','重要 + 紧急'],['q2','重要 + 不紧急'],['q3','不重要 + 紧急'],['q4','不重要 + 不紧急']];return'<div class="quads">'+a.map(function(x){var list=sort(active().filter(function(t){return q(t)===x[0]}));return'<div class="quad '+x[0]+'"><h3>'+x[1]+'</h3>'+(list.length?list.map(function(t){return'<div class="mini">• '+esc(t.title)+' <span class="meta">· '+dl(t.due)+'</span></div>'}).join(''):'<span class="muted">暂无任务</span>')+'</div>'}).join('')+'</div>'}function empty(x){return'<div class="empty">'+x+'</div>'}
function navHtml(){return navs.map(function(x){var c=x[0]==='today'?active().filter(function(t){return t.due<=pd(0)}).length:x[0]==='intelligence'?s.news.length:x[0]==='tasks'?active().length:x[0]==='goals'?s.goals.length:'';return'<button data-page="'+x[0]+'" class="'+(s.page===x[0]?'active':'')+'"><span>'+x[1]+'</span>'+x[2]+(c!==''?'<span class="count">'+c+'</span>':'')+'</button>'}).join('')}
function today(){var ai=active().filter(function(t){return q(t)==='q1'}).length,soon=active().filter(function(t){var d=left(t.due);return d>=0&&d<=3}).length,top=sort(active().filter(function(t){return left(t.due)<=7})).slice(0,5),date=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());var stats=[[active().filter(function(t){return t.due<=pd(0)}).length,'今日待办'],[ai,'重要且紧急'],[soon,'3 天内到期'],[s.goals.length,'进行中目标']];return head('今天先做最重要的事',date,'<button class="btn primary" data-open-task>＋ 新建任务</button>')+'<div class="grid stats">'+stats.map(function(x){return'<div class="card stat"><strong>'+x[0]+'</strong><span class="muted">'+x[1]+'</span></div>'}).join('')+'</div><div class="grid home"><div class="stack"><div class="card"><div class="sec"><div><h2>今天最该处理的事</h2><small class="muted">最多 5 项</small></div><button class="link" data-page="tasks">查看全部 →</button></div>'+(top.length?top.map(function(t){return task(t,0)}).join(''):empty('当前没有必须处理的事项'))+'</div><div class="card"><div class="sec"><h2>任务四象限</h2><button class="link" data-view="quadrant">进入四象限 →</button></div>'+quads()+'</div></div><div class="stack"><div class="card"><div class="sec"><h2>目标进度</h2><button class="link" data-page="goals">全部目标 →</button></div>'+s.goals.map(prog).join('')+'</div><div class="card"><div class="sec"><div><h2>今日情报</h2><small class="muted">演示数据</small></div><button class="link" data-page="intelligence">查看情报 →</button></div>'+s.news.slice(0,4).map(function(n){return'<div class="brief"><div class="row small"><span><span class="tag blue">'+n.category+'</span> '+n.source+'</span><span>'+n.time+'</span></div><b>'+esc(n.title)+'</b><span class="muted">'+esc(n.summary)+'</span></div>'}).join('')+'</div></div></div>'}
function intelligence(){var cats=['全部','财经','证券','A股','宏观','银行','保险','投行','国际','时政','考公'],news=s.cat==='全部'?s.news:s.news.filter(function(n){return n.category===s.cat});return head('每日情报','不是无限新闻流，而是快速知道今天值得关注什么。','')+'<div class="seg">'+cats.map(function(c){return'<button data-cat="'+c+'" class="'+(s.cat===c?'active':'')+'">'+c+'</button>'}).join('')+'</div><div class="card" style="margin-bottom:15px"><div class="insight"><b>当前为演示内容。</b> 后续接入真实新闻源，保留来源、时间和原文；政治与时政只做事实与来源整理，不替用户作政治选择。</div></div><div class="grid newsgrid">'+news.map(function(n){return'<article class="card news"><div class="row small"><span><span class="tag blue">'+n.category+'</span> '+n.source+'</span><span>'+n.time+'</span></div><h3>'+esc(n.title)+'</h3><p>'+esc(n.summary)+'</p><div class="why"><b>为什么关注：</b>'+esc(n.why)+'</div></article>'}).join('')+'</div>'}
function tasks(){var list=s.view==='done'?s.tasks.filter(function(t){return t.done}):s.view==='today'?sort(active().filter(function(t){return t.due<=pd(0)})):sort(active());var tabs=[['today','今日'],['quadrant','四象限'],['all','所有任务'],['done','已完成']];return head('任务','所有任务统一管理，四象限只是任务的一种视图。','<button class="btn primary" data-open-task>＋ 新建任务</button>')+'<div class="seg">'+tabs.map(function(x){return'<button data-view="'+x[0]+'" class="'+(s.view===x[0]?'active':'')+'">'+x[1]+'</button>'}).join('')+'</div>'+(s.view==='quadrant'?'<div class="card">'+quads()+'</div>':'<div class="grid tasklayout"><div class="card">'+(list.length?list.map(function(t){return task(t,1)}).join(''):empty('这里暂时没有任务'))+'</div><aside class="card"><div class="insight"><b>任务规则</b><br>创建时只判断重要与紧急，系统自动进入四象限；第二象限长期保留可见性。</div></aside></div>')}
function goals(){return head('目标','同时看完成进度、时间进度和剩余天数。','<button class="btn primary" data-open-goal>＋ 新建目标</button>')+'<div class="grid goals">'+(s.goals.length?s.goals.map(function(g){return'<div class="card goal"><span class="tag blue">'+g.category+'</span><h3>'+esc(g.title)+'</h3><span class="muted">'+g.start+' → '+g.end+'</span><div class="days">'+Math.max(0,left(g.end))+'<small class="muted"> 天剩余</small></div>'+prog(g)+'<div class="range"><input type="range" min="0" max="100" value="'+g.progress+'" data-range="'+g.id+'"><b>'+g.progress+'%</b><button class="btn" data-del-goal="'+g.id+'">删除</button></div></div>'}).join(''):empty('还没有目标'))+'</div>'}
function category(k){var c={work:'工作',life:'生活',growth:'成长'}[k],ts=sort(active().filter(function(t){return t.category===c||(k==='growth'&&['成长','考公','学习'].indexOf(t.category)>=0)})),gs=s.goals.filter(function(g){return g.category===c||(k==='growth'&&['成长','考公'].indexOf(g.category)>=0)}),copy={work:'管理正式工作与项目事项，始终保留清晰下一步。',life:'管理缴费、出行、健康与日常事项，不让生活被工作挤掉。',growth:'考公、金融知识、技能、求职与证书都属于长期复利事项。'}[k];return head(c,copy,'<button class="btn primary" data-open-task data-default="'+c+'">＋ 添加'+c+'事项</button>')+'<div class="grid catlayout"><div class="card">'+(ts.length?ts.map(function(t){return task(t,1)}).join(''):empty('暂无事项'))+'</div><aside class="stack"><div class="card"><div class="sec"><h2>相关目标</h2></div>'+(gs.length?gs.map(prog).join(''):empty('暂无关联目标'))+'</div><div class="card"><div class="insight">'+(k==='growth'?'长期成长通常重要但不紧急，所以第二象限会持续保留在视野中。':'先管理真正会忘记、会逾期、会影响结果的事项。')+'</div></div></aside></div>'}
function render(){document.getElementById('nav').innerHTML=navHtml();document.getElementById('crumb').textContent={today:'今日',intelligence:'情报',tasks:'任务',goals:'目标',work:'工作',life:'生活',growth:'成长'}[s.page];var f={today:today,intelligence:intelligence,tasks:tasks,goals:goals,work:function(){return category('work')},life:function(){return category('life')},growth:function(){return category('growth')}}[s.page];document.getElementById('content').innerHTML=f();bind()}function go(p){s.page=p;save();render();window.scrollTo(0,0);document.getElementById('side').classList.remove('open')}function open(id){document.getElementById(id).classList.add('open')}function close(id){document.getElementById(id).classList.remove('open')}function openTask(def){taskForm.reset();taskForm.due.value=pd(0);if(def)taskForm.category.value=def;goalSelect.innerHTML='<option value="">不关联目标</option>'+s.goals.map(function(g){return'<option value="'+g.id+'">'+esc(g.title)+'</option>'}).join('');open('taskModal')}
function bind(){document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}});document.querySelectorAll('[data-open-task]').forEach(function(b){b.onclick=function(){openTask(b.dataset.default||'')}});document.querySelectorAll('[data-open-goal]').forEach(function(b){b.onclick=function(){goalForm.reset();goalForm.start.value=pd(0);goalForm.end.value=pd(90);open('goalModal')}});document.querySelectorAll('[data-toggle]').forEach(function(b){b.onclick=function(){var t=s.tasks.find(function(x){return x.id===b.dataset.toggle});t.done=!t.done;save();render();toast(t.done?'任务已完成':'任务已恢复')}});document.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){s.tasks=s.tasks.filter(function(t){return t.id!==b.dataset.del});save();render();toast('任务已删除')}});document.querySelectorAll('[data-view]').forEach(function(b){b.onclick=function(){s.view=b.dataset.view;s.page='tasks';save();render()}});document.querySelectorAll('[data-cat]').forEach(function(b){b.onclick=function(){s.cat=b.dataset.cat;save();render()}});document.querySelectorAll('[data-range]').forEach(function(b){b.oninput=function(){s.goals.find(function(g){return g.id===b.dataset.range}).progress=Number(b.value);save();render()}});document.querySelectorAll('[data-del-goal]').forEach(function(b){b.onclick=function(){s.goals=s.goals.filter(function(g){return g.id!==b.dataset.delGoal});save();render();toast('目标已删除')}})}
document.getElementById('nav').onclick=function(e){var b=e.target.closest('[data-page]');if(b)go(b.dataset.page)};menu.onclick=function(){side.classList.toggle('open')};quick.onclick=function(){openTask('')};document.querySelectorAll('.close').forEach(function(b){b.onclick=function(){b.closest('.modalbg').classList.remove('open')}});document.querySelectorAll('.modalbg').forEach(function(m){m.onclick=function(e){if(e.target===m)m.classList.remove('open')}});taskForm.onsubmit=function(e){e.preventDefault();var f=new FormData(taskForm);s.tasks.push({id:crypto.randomUUID(),title:f.get('title').trim(),category:f.get('category'),due:f.get('due'),important:f.get('important')==='1',urgent:f.get('urgent')==='1',goal:f.get('goal'),done:false});save();close('taskModal');render();toast('任务已添加')};goalForm.onsubmit=function(e){e.preventDefault();var f=new FormData(goalForm);if(f.get('end')<f.get('start'))return toast('截止日期不能早于开始日期');s.goals.push({id:crypto.randomUUID(),title:f.get('title').trim(),category:f.get('category'),progress:Number(f.get('progress')),start:f.get('start'),end:f.get('end'),next:f.get('next').trim()});save();close('goalModal');render();toast('目标已添加')};reset.onclick=function(){if(confirm('恢复演示数据？本浏览器中的修改会被清除。')){s=seed();save();render();toast('已恢复演示数据')}};search.oninput=function(){var x=search.value.trim().toLowerCase();if(!x){pop.classList.remove('open');return}var r=[];s.tasks.forEach(function(t){if((t.title+t.category).toLowerCase().indexOf(x)>=0)r.push(['任务',t.title,'tasks'])});s.goals.forEach(function(g){if((g.title+g.category).toLowerCase().indexOf(x)>=0)r.push(['目标',g.title,'goals'])});s.news.forEach(function(n){if((n.title+n.summary).toLowerCase().indexOf(x)>=0)r.push(['情报',n.title,'intelligence'])});r=r.slice(0,8);pop.innerHTML=r.length?r.map(function(a){return'<button class="result" data-result="'+a[2]+'"><span class="tag">'+a[0]+'</span> '+esc(a[1])+'</button>'}).join(''):empty('没有匹配内容');pop.classList.add('open');pop.querySelectorAll('[data-result]').forEach(function(b){b.onclick=function(){search.value='';pop.classList.remove('open');go(b.dataset.result)}})};render();
</script>
